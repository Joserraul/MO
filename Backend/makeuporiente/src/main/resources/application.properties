spring.application.name=makeuporiente
spring.datasource.url=jdbc:mysql://localhost:3306/orientecatalog
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS — orígenes exactos que pueden llamar a la API.
# Además de estos, el backend acepta automáticamente:
#   - localhost / 127.0.0.1 (cualquier puerto)
#   - toda tu red local (192.168.x.x y 10.x.x.x) para probar desde el celular
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# JWT — cambia esta clave en producción (mínimo 32 caracteres)
jwt.secret=makeup-oriente-secret-change-in-production-2026!
jwt.expiration=86400000
